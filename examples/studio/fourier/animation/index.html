<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fourier drawing · Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app-shell">
    <header>
      <p class="eyebrow">Fourier drawing</p>
      <h1>Fourier drawing</h1>
      <p class="lede">Computed coefficients become a choreography of rotating vectors.</p>
    </header>
    <marimo-output render="scene.py" aria-label="Rotating vectors">
      <video controls playsinline preload="metadata"></video>
      <div class="playback">
        <button class="replay" type="button">Replay</button>
        <label><input class="loop" type="checkbox"> Loop</label>
        <label>Speed <select class="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <p class="details"></p>
    </marimo-output>
    <section class="context" aria-label="Notebook context">
      <h2>Explore the computation</h2>
      <marimo-cell name="controls"></marimo-cell>
      <div class="pair">
        <marimo-output render="spectrum.py" aria-label="Spectrum">
          <video controls playsinline preload="metadata"></video>
          <div class="playback">
            <button class="replay" type="button">Replay</button>
            <label><input class="loop" type="checkbox"> Loop</label>
          </div>
        </marimo-output>
        <marimo-cell name="comparison"></marimo-cell>
      </div>
    </section>
    <script src="player.js"></script>
  </main>
</body>
</html>
