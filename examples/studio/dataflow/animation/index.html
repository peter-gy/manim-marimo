<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A notebook is a dataflow graph</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app-shell">
    <header>
      <h1>A notebook is a dataflow graph</h1>
      <p class="lede">Move one of the small notebook's sliders and see which of its cells rerun, in the order marimo runs them.</p>
    </header>
    <marimo-output render="scene.py" aria-label="The notebook's cells, sorted and rerun">
      <video controls playsinline preload="metadata"></video>
      <div class="playback">
        <button class="replay" type="button">Replay</button>
        <label><input class="loop" type="checkbox"> Loop</label>
        <label>Speed <select class="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <p class="details"></p>
    </marimo-output>
    <section class="context" aria-label="Notebook context">
      <h2>Explore the computation</h2>
      <marimo-cell name="controls"></marimo-cell>
      <marimo-cell name="summary"></marimo-cell>
    </section>
    <script src="player.js"></script>
  </main>
</body>
</html>
