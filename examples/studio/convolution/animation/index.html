<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convolution of dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app-shell">
    <header>
      <h1>Convolution of dice</h1>
      <p class="lede">Follow the joint probability table as its diagonals become a distribution.</p>
    </header>
    <marimo-output render="scene.py" aria-label="The diagonals of the joint table filling the distribution">
      <video controls playsinline preload="metadata"></video>
      <div class="playback">
        <button class="replay" type="button">Replay</button>
        <label><input class="loop" type="checkbox"> Loop</label>
        <label>Speed <select class="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <p class="details"></p>
    </marimo-output>
    <section class="context" aria-label="Notebook context">
      <h2>Explore the computation</h2>
      <marimo-cell name="controls"></marimo-cell>
      <div class="pair">
        <marimo-cell name="distribution_chart"></marimo-cell>
        <marimo-cell name="joint_table"></marimo-cell>
      </div>
    </section>
    <script src="player.js"></script>
  </main>
</body>
</html>
