[project]
name = "marimo-manim"
version = "0.1.0"
description = "Manim animations of marimo notebook results, as marimo-studio views"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Péter Ferenc Gyarmati", email = "dev.petergy@gmail.com" }]
keywords = ["marimo", "marimo-studio", "manim", "animation", "notebooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10,<3.15"
dependencies = [
  # Python 3.13 removed audioop, which ManimGL imports through pydub.
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "imageio-ffmpeg>=0.6,<0.7",
  "manimgl>=1.7.2,<1.8",
  "marimo-studio @ https://github.com/marimo-team/marimo-studio/releases/download/preview/marimo_studio-0.3.1.dev25-py3-none-any.whl",
  # ManimGL 1.7 reads its version through pkg_resources at import.
  "setuptools>=70,<81",
]

[project.urls]
Homepage = "https://peter-gy.github.io/marimo-manim/"
Documentation = "https://peter-gy.github.io/marimo-manim/"
Repository = "https://github.com/peter-gy/marimo-manim"
Issues = "https://github.com/peter-gy/marimo-manim/issues"

[project.entry-points."marimo_studio.view_provider"]
manim = "marimo_manim._provider:provider"

[build-system]
requires = ["agent-plugins>=0.2.4,<0.3", "uv_build>=0.13.1,<0.14"]
build-backend = "agent_plugins.build.uv_build"

# The wheel ships plugin.json and skills/ as an Agent Plugin, which
# `agent-plugins read marimo-manim` prints for coding agents.
[tool.agent-plugins]
root = "."

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["render: renders a scene with ManimGL, OpenGL, and FFmpeg"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ty.environment]
python-version = "3.10"
