<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__NOTEBOOK_LABEL_HTML__ · Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app-shell">
    <header>
      <p class="eyebrow">__NOTEBOOK_LABEL_HTML__</p>
      <h1>From data to motion</h1>
      <p class="lede">An animation grounded in the notebook's computations.</p>
    </header>
    <marimo-output render="scene.py" aria-label="Animation">
      <video controls playsinline preload="metadata"></video>
      <div class="playback">
        <button class="replay" type="button">Replay</button>
        <label><input class="loop" type="checkbox"> Loop</label>
        <label>Speed <select class="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      </div>
      <p class="details"></p>
    </marimo-output>
    <section class="context" aria-label="Notebook context">
      __CELLS__
    </section>
    <script src="player.js"></script>
  </main>
</body>
</html>
