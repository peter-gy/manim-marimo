# System tools for developing and rendering marimo-manim, installed from
# conda-forge. uv owns the Python environment (uv.lock) and pnpm owns the
# documentation site (docs/pnpm-lock.yaml). Every task runs through
# `pixi run`, which activates this environment.
[workspace]
name = "marimo-manim"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.82"

[dependencies]
uv = ">=0.13.1,<0.14"
nodejs = ">=24"
pnpm = ">=10"

# ManimGL needs an OpenGL context. macOS provides one. On Linux, Mesa renders
# in software through EGL, so scenes render on servers and CI runners without
# a display or a GPU.
#
# manimpango, which ManimGL uses for Text, publishes no Linux wheels, so uv
# compiles it against Pango. conda-forge's compiler links the extension to this
# environment's libraries, and its fonts give Text a typeface to render.
[target.linux.dependencies]
mesalib = ">=25"
libegl = ">=1.7"
libgl = ">=1.7"
pango = ">=1.56"
cairo = ">=1.18"
pkg-config = ">=0.29"
c-compiler = ">=1.9"
fonts-conda-ecosystem = "*"

# glcontext loads OpenGL by library name, so point it at this environment's
# libraries, and let libglvnd find Mesa's EGL driver here.
[target.linux.activation.env]
GLCONTEXT_LINUX_LIBGL = "$CONDA_PREFIX/lib/libGL.so.1"
GLCONTEXT_LINUX_LIBEGL = "$CONDA_PREFIX/lib/libEGL.so.1"
__EGL_VENDOR_LIBRARY_DIRS = "$CONDA_PREFIX/share/glvnd/egl_vendor.d"

[tasks]
sync = { cmd = "uv sync --locked", description = "Install the Python environment from uv.lock" }

lint = { cmd = "uv run ruff check src tests examples && uv run ruff format --check src tests examples && uv tool run --from actionlint-py==1.7.12.25 actionlint", depends-on = ["sync"], description = "Check lint, formatting, and workflows" }
format = { cmd = "uv run ruff check --fix src tests examples && uv run ruff format src tests examples", depends-on = ["sync"], description = "Fix lint and formatting" }
typecheck = { cmd = "uv run ty check && uv run basedpyright --level error", depends-on = ["sync"], description = "Type-check the package and tests" }
test = { cmd = "uv run pytest", depends-on = ["sync"], description = "Run every test, including scene renders" }
check = { depends-on = ["lint", "typecheck", "test"], description = "Run every check CI runs" }

example = { cmd = "uv run marimo-studio validate --target examples/{{ name }}.py && uv run marimo-studio view build animation --target examples/{{ name }}.py", args = [{ arg = "name" }], depends-on = ["sync"], description = "Validate and build one example view" }
examples = { depends-on = [{ task = "example", args = ["fourier"] }, { task = "example", args = ["convolution"] }], description = "Validate and build both example views" }
edit = { cmd = "uv run marimo edit examples/{{ example }}.py --no-sandbox --watch", args = [{ arg = "example", default = "fourier" }], depends-on = ["sync"], description = "Open an example notebook in Studio" }
build = { cmd = "uv build", description = "Build the wheel and sdist into dist/" }

docs-install = { cmd = "pnpm install --frozen-lockfile", cwd = "docs", description = "Install the documentation site" }
docs-dev = { cmd = "pnpm dev", cwd = "docs", depends-on = ["docs-install"], description = "Serve the documentation with live reload" }
docs-build = { cmd = "pnpm build", cwd = "docs", depends-on = ["docs-install"], description = "Build the documentation site" }
