# The development environment of marimo-manim. Python, the libraries ManimGL
# links against, and the tools for checks and docs come from conda-forge. The
# package and its Python dependencies come from PyPI, with marimo-manim
# installed in editable mode. Every task runs through `pixi run`.
[workspace]
name = "marimo-manim"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.82"

[dependencies]
python = ">=3.10,<3.15"
# ManimGL's text renderer. conda-forge builds it against Pango on every
# platform, where PyPI ships no Linux wheels.
manimpango = ">=0.6"

[pypi-dependencies]
marimo-manim = { path = ".", editable = true }

# ManimGL needs an OpenGL context. macOS provides one. On Linux, Mesa renders
# in software through EGL, so scenes render on servers and CI runners without
# a display or a GPU, and conda-forge's fonts give Text a typeface.
[target.linux.dependencies]
mesalib = ">=25"
libegl = ">=1.7"
libgl = ">=1.7"
fonts-conda-ecosystem = "*"

# glcontext loads OpenGL by library name, so point it at this environment's
# libraries, and let libglvnd find Mesa's EGL driver here.
[target.linux.activation.env]
GLCONTEXT_LINUX_LIBGL = "$CONDA_PREFIX/lib/libGL.so.1"
GLCONTEXT_LINUX_LIBEGL = "$CONDA_PREFIX/lib/libEGL.so.1"
__EGL_VENDOR_LIBRARY_DIRS = "$CONDA_PREFIX/share/glvnd/egl_vendor.d"

[feature.dev.dependencies]
actionlint = ">=1.7"
uv = ">=0.13.1,<0.14"

[feature.dev.pypi-dependencies]
basedpyright = ">=1.40.2"
pytest = ">=9.1.1"
ruff = ">=0.17.0"
ty = ">=0.0.87"

[feature.docs.dependencies]
nodejs = ">=24"
pnpm = ">=10"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = { features = ["dev", "docs", "py313"], solve-group = "py313" }
py310 = ["dev", "py310"]
py311 = ["dev", "py311"]
py312 = ["dev", "py312"]
py313 = { features = ["dev", "py313"], solve-group = "py313" }
py314 = ["dev", "py314"]

[tasks]
lint = { cmd = "ruff check src tests examples && ruff format --check src tests examples && actionlint", description = "Check lint, formatting, and workflows" }
format = { cmd = "ruff check --fix src tests examples && ruff format src tests examples", description = "Fix lint and formatting" }
typecheck = { cmd = "ty check && basedpyright --level error", description = "Type-check the package and tests" }
test = { cmd = "pytest", description = "Run every test, including scene renders" }
check = { depends-on = ["lint", "typecheck", "test"], description = "Run every check CI runs" }

example = { cmd = "marimo-studio validate --target examples/{{ name }}.py && marimo-studio view build animation --target examples/{{ name }}.py", args = [{ arg = "name" }], description = "Validate and build one example view" }
examples = { depends-on = [{ task = "example", args = ["fourier"] }, { task = "example", args = ["convolution"] }], description = "Validate and build both example views" }
edit = { cmd = "marimo edit examples/{{ example }}.py --no-sandbox --watch", args = [{ arg = "example", default = "fourier" }], description = "Open an example notebook in Studio" }
build = { cmd = "uv build", description = "Build the wheel and sdist into dist/" }

docs-install = { cmd = "pnpm install --frozen-lockfile", cwd = "docs", description = "Install the documentation site" }
docs-dev = { cmd = "pnpm dev", cwd = "docs", depends-on = ["docs-install"], description = "Serve the documentation with live reload" }
docs-build = { cmd = "pnpm build", cwd = "docs", depends-on = ["docs-install"], description = "Build the documentation site" }
