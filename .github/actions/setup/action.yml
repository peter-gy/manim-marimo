name: Set up
description: Install pixi and one locked environment of the workspace.

inputs:
  environment:
    description: The pixi environment to install, such as default or py310.
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: v0.82.0
        environments: ${{ inputs.environment }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
