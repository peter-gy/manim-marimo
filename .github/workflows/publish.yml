name: Publish

# An annotated vX.Y.Z tag on main publishes that release to PyPI, verifies the
# public install, and then creates the GitHub release. A main commit that
# passed CI publishes a preview wheel to the `preview` GitHub release.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Resolve the version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A preview of the commits after release vX.Y.Z is X.Y.(Z+1).devN,
          # where N counts those commits. Before the first release, previews
          # lead up to the version in pyproject.toml.
          if base="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null)"; then
            IFS=. read -r major minor patch <<<"${base#v}"
            version="$major.$minor.$((patch + 1)).dev$(git rev-list --count "$base..HEAD")"
          else
            version="$(pixi run uv version --short).dev$(git rev-list --count HEAD)"
          fi
          pixi run uv version --frozen "$version"
          echo "channel=preview" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pixi run build
      - run: scripts/release/check-dist.sh

      - name: Check the release
        if: steps.version.outputs.channel == 'release'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-release.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: build
    if: needs.build.outputs.channel == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/manim-marimo/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*

  verify:
    name: Verify PyPI
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: scripts/release/verify-pypi.sh "${{ needs.build.outputs.version }}"

  release:
    name: GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag
          --title "manim-marimo ${GITHUB_REF_NAME#v}"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"

  preview:
    name: Preview release
    needs: build
    if: needs.build.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload the wheel to the preview release
        run: |
          wheel="manim_marimo-$VERSION-py3-none-any.whl"
          url="https://github.com/$GH_REPO/releases/download/preview/$wheel"
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --title "Preview builds" \
              --notes "Wheels built from main."
          fi
          gh release upload preview "dist/$wheel" --clobber
          cat > notes.md <<NOTES
          Wheels built from main. The newest is $VERSION. Declare it in the
          notebook's script metadata and start Studio with the same wheel:

          \`\`\`python
          # dependencies = [
          #     "manim-marimo[render] @ $url",
          # ]
          \`\`\`

          \`\`\`sh
          uvx --with "manim-marimo @ $url" marimo edit analysis.py --sandbox=pixi --watch
          \`\`\`
          NOTES
          gh release edit preview --notes-file notes.md
