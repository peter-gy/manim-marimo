name: Publish

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Previews publish commits on main that passed CI. Releases publish tags.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Resolve the version
        id: version
        run: |
          declared="$(pixi run uv version --short)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$declared" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml."
              exit 1
            fi
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "version=$declared" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A preview of the commits after release vX.Y.Z is X.Y.(Z+1).devN,
          # where N counts those commits. Before the first release, previews
          # lead up to the version in pyproject.toml.
          if base="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null)"; then
            IFS=. read -r major minor patch <<<"${base#v}"
            version="$major.$minor.$((patch + 1)).dev$(git rev-list --count "$base..HEAD")"
          else
            version="$declared.dev$(git rev-list --count HEAD)"
          fi
          pixi run uv version --frozen "$version"
          echo "channel=preview" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pixi run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  preview:
    name: Preview release
    needs: build
    if: needs.build.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-preview-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload the wheel to the preview release
        run: |
          wheel="marimo_manim-$VERSION-py3-none-any.whl"
          url="https://github.com/$GH_REPO/releases/download/preview/$wheel"
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --title "Preview builds" \
              --notes "Wheels built from main."
          fi
          gh release upload preview "dist/$wheel" --clobber
          cat > notes.md <<NOTES
          Wheels built from main. The newest is $VERSION:

          \`\`\`sh
          uv add "marimo-manim @ $url"
          \`\`\`
          NOTES
          gh release edit preview --notes-file notes.md

  release:
    name: GitHub release
    needs: build
    if: needs.build.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  pypi:
    name: PyPI
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/marimo-manim/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pixi run uv publish --trusted-publishing always dist/*
