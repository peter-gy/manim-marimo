<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>manim-marimo hero</title>
    <style>
      @font-face {
        font-family: "CMU Bright";
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-bright-500-roman.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Bright";
        font-weight: 600;
        src: url("node_modules/computer-modern/fonts/cmu-bright-600-roman.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Serif";
        font-style: italic;
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-serif-500-italic.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Typewriter Text";
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-typewriter-text-500-roman.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Typewriter Text";
        font-weight: 700;
        src: url("node_modules/computer-modern/fonts/cmu-typewriter-text-700-roman.woff2") format("woff2");
      }

      /* Frames are opaque, on the documentation site's page colors, so
         animated WebP frames blend without lossy alpha. The colors keep the
         site's meanings: notebook results are green, the scene is blue, and
         yellow surrounds what the movie reads. */
      :root {
        --page: #ffffff;
        --ring: #b8860b;
        --ring-wash: rgb(184 134 11 / 9%);
        --notebook: #4f7a3a;
        --scene: #1c758a;
        --card-bg: #ffffff;
        --card-border: #d5d9dd;
        --chip: #e8e8ec;
        --chip-text: #3c4043;
        --chrome: #f6f7f8;
        --chrome-rule: #e6e8eb;
        --code: #16191d;
        --label: #16191d;
        --muted: #7d858e;
        --notebook-bg: #ffffff;
      }

      body[data-theme="dark"] {
        --page: #11161c;
        --ring: #ffff00;
        --ring-wash: rgb(255 255 0 / 8%);
        --notebook: #83c167;
        --scene: #58c4dd;
        --card-bg: #151b22;
        --card-border: #333b45;
        --chip: #1b537b;
        --chip-text: #dbe9f5;
        --chrome: #1a2129;
        --chrome-rule: #222932;
        --code: #ececec;
        --label: #ececec;
        --muted: #848b94;
        --notebook-bg: #151b22;
      }

      html,
      body {
        margin: 0;
      }

      #canvas {
        background: var(--page);
      }

      #canvas {
        display: grid;
        grid-template-columns: 472px 1fr;
        align-items: stretch;
        gap: 24px;
        box-sizing: border-box;
        width: 1200px;
        padding: 24px 32px;
        font-family: "CMU Bright", system-ui, sans-serif;
      }

      .card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--card-border);
        border-radius: 2px;
        background: var(--card-bg);
      }

      .card > header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 34px;
        padding: 0 14px;
        border-bottom: 1px solid var(--chrome-rule);
        background: var(--chrome);
        color: var(--label);
        font-size: 14px;
        font-weight: 400;
      }

      .card > header span:last-child {
        color: var(--muted);
        font: 400 13px "CMU Typewriter Text", ui-monospace, monospace;
      }

      .card.is-notebook {
        background: var(--notebook-bg);
      }

      .card.is-notebook > header {
        color: var(--notebook);
      }

      .notebook {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 14px 18px;
      }

      /* The cell the movie reads gets Manim's SurroundingRectangle: square,
         yellow, and clear of marimo's own border. */
      .cell {
        position: relative;
      }

      .cell img {
        display: block;
        width: 100%;
      }

      .cell::after {
        position: absolute;
        inset: -5px;
        border: 2px solid var(--ring);
        content: "";
        opacity: var(--focus, 0);
        pointer-events: none;
      }

      .cursor {
        position: absolute;
        z-index: 2;
        width: 20px;
        height: 20px;
        margin: -2px 0 0 -4px;
        opacity: 0;
        transform-origin: 4px 2px;
        filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 35%));
        pointer-events: none;
      }

      .view {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
      }

      .movie {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #000;
      }

      .movie img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .movie .next {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .render {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 14px;
        background: rgb(0 0 0 / 46%);
        opacity: 0;
      }

      .render span {
        padding: 5px 10px 5px 9px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 2px;
        background: rgb(17 22 28 / 86%);
        color: #ececec;
        font: 400 12.5px "CMU Typewriter Text", ui-monospace, monospace;
      }

      .render span::before {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: #58c4dd;
        vertical-align: 1px;
        content: "";
      }

      .render i {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 100%;
        background: #58c4dd;
        transform: scaleX(var(--progress, 0));
        transform-origin: left;
      }

      .player {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
        height: 34px;
        padding: 0 14px;
        border-bottom: 1px solid var(--chrome-rule);
        color: var(--muted);
        font: 400 12px "CMU Typewriter Text", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }

      .player .track {
        height: 2px;
        overflow: hidden;
        background: var(--chrome-rule);
      }

      .player .track i {
        display: block;
        height: 100%;
        background: var(--scene);
        transform: scaleX(var(--progress, 0));
        transform-origin: left;
      }

      .reads {
        flex: 1 1 auto;
        padding: 18px 14px 16px;
      }

      .reads h2 {
        margin: 0 0 10px 10px;
        color: var(--muted);
        font: italic 400 16px "CMU Serif", serif;
      }

      .read {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 14px;
        height: 40px;
        padding: 0 10px;
      }

      .read::before {
        position: absolute;
        inset: 3px 0;
        border: 2px solid var(--ring);
        background: var(--ring-wash);
        content: "";
        opacity: var(--focus, 0);
      }

      .read code {
        position: relative;
        color: var(--code);
        font: 400 14px "CMU Typewriter Text", ui-monospace, monospace;
      }

      .read code b {
        color: var(--notebook);
        font-weight: 400;
      }

      .read output {
        position: relative;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      /* The chip repeats marimo's cell-name tag, which names the read's cell
         in the notebook card. */
      .read .chip {
        position: relative;
        min-width: 112px;
        padding: 3px 7px;
        border-radius: 2px;
        background: var(--chip);
        color: var(--chip-text);
        font: 400 12px "CMU Typewriter Text", ui-monospace, monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <section class="card is-notebook">
        <header><span>Notebook</span><span>convolution.py</span></header>
        <div class="notebook">
          <div class="cell" data-cell="controls"><img alt="" /></div>
          <div class="cell" data-cell="distributions"><img alt="" /></div>
          <div class="cell" data-cell="chart"><img alt="" /></div>
        </div>
      </section>
      <section class="card">
        <header><span>Animation view</span><span>scene.py</span></header>
        <div class="view">
          <div class="movie">
            <img class="current" alt="" />
            <img class="next" alt="" />
            <div class="render"><span></span><i></i></div>
          </div>
          <div class="player">
            <span class="time"></span>
            <div class="track"><i></i></div>
            <span class="meta"></span>
          </div>
          <div class="reads">
            <h2>Reads from the notebook</h2>
            <div class="read" data-read="joint">
              <code>value(<b>"joint"</b>)</code><output>6 × 6 table</output><span class="chip">distributions</span>
            </div>
            <div class="read" data-read="probabilities">
              <code>value(<b>"probabilities"</b>)</code><output>11 sums</output><span class="chip">distributions</span>
            </div>
            <div class="read" data-read="mean">
              <code>value(<b>"mean"</b>)</code><output></output><span class="chip">distributions</span>
            </div>
            <div class="read" data-read="figure">
              <code>output(<b>"distribution_figure"</b>)</code><output>matplotlib figure</output
              ><span class="chip">distribution_chart</span>
            </div>
          </div>
        </div>
      </section>
    </div>
    <svg class="cursor" viewBox="0 0 20 20" aria-hidden="true">
      <path
        d="M4 2.2v13.6l3.5-3.3 2.3 5.2 2.4-1-2.3-5.1h4.9z"
        fill="#111"
        stroke="#fff"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>
    <script type="module">
      const { manifest, theme } = window.hero;
      document.body.dataset.theme = theme;
      const shots = manifest.cells[theme];
      const cell = (name) => document.querySelector(`[data-cell="${name}"]`);
      const movie = document.querySelector(".movie");
      const cursor = document.querySelector(".cursor");
      const canvas = document.getElementById("canvas");

      const load = (img, src) =>
        img.getAttribute("src") === src ? Promise.resolve() : ((img.src = src), img.decode());
      const frame = (state, index) =>
        `shots/movie-${state}/${String(index + 1).padStart(4, "0")}.png`;

      await load(cell("distributions").querySelector("img"), `shots/${shots.distributions.file}`);

      // `show` paints one frame of the timeline render.ts computes.
      window.show = async (frameState) => {
        const { cursor: pointer, focus, movie: shown, reads, render, step } = frameState;
        await Promise.all([
          load(cell("controls").querySelector("img"), `shots/${shots.controls[step].file}`),
          load(cell("chart").querySelector("img"), `shots/${shots.chart[step].file}`),
          load(movie.querySelector(".current"), frame(shown.state, shown.frame)),
          shown.next
            ? load(movie.querySelector(".next"), frame(shown.next.state, shown.next.frame))
            : Promise.resolve(),
        ]);
        movie.querySelector(".next").style.opacity = String(shown.next?.opacity ?? 0);
        for (const name of ["controls", "distributions", "chart"]) {
          cell(name).style.setProperty("--focus", String(focus[name] ?? 0));
        }
        for (const row of document.querySelectorAll("[data-read]")) {
          row.style.setProperty("--focus", String(reads[row.dataset.read] ?? 0));
        }
        document.querySelector('[data-read="mean"] output').textContent = frameState.mean;

        // The player follows whichever movie shows more.
        const playing = (shown.next?.opacity ?? 0) > 0.5 ? shown.next : shown;
        const { movie: metadata } = manifest.states[playing.state];
        const progress = playing.frame / (manifest.states[playing.state].frames - 1);
        const clock = (seconds) => `0:${String(Math.floor(seconds)).padStart(2, "0")}`;
        const player = document.querySelector(".player");
        player.querySelector(".track").style.setProperty("--progress", String(progress));
        player.querySelector(".time").textContent =
          `${clock(playing.frame / manifest.fps)} / ${clock(Math.ceil(metadata.duration))}`;
        player.querySelector(".meta").textContent =
          `${metadata.width} × ${metadata.height} · ${metadata.fps} fps`;

        const overlay = movie.querySelector(".render");
        overlay.style.opacity = String(render.opacity);
        overlay.style.setProperty("--progress", String(render.progress));
        overlay.querySelector("span").textContent = render.label;

        // The pointer rests on the slider thumb at a fractional step, so it
        // glides while the slider snaps to 0.1 steps, as a drag does.
        const controls = cell("controls");
        const scale = controls.clientWidth / shots.controls[0].width;
        const at = Math.min(Math.max(pointer.step, 0), shots.controls.length - 1);
        const low = shots.controls[Math.floor(at)].thumb;
        const high = shots.controls[Math.ceil(at)].thumb;
        const fraction = at - Math.floor(at);
        const box = controls.getBoundingClientRect();
        const origin = canvas.getBoundingClientRect();
        const x = box.left - origin.left + (low.x + (high.x - low.x) * fraction) * scale;
        const y = box.top - origin.top + low.y * scale;
        cursor.style.left = `${x + pointer.dx}px`;
        cursor.style.top = `${y + pointer.dy}px`;
        cursor.style.opacity = String(pointer.opacity);
        cursor.style.transform = `scale(${pointer.pressed ? 0.9 : 1})`;
      };

      canvas.append(cursor);
      canvas.style.position = "relative";
      await document.fonts.ready;
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
