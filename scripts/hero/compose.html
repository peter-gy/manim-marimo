<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>manim-marimo hero</title>
    <style>
      @font-face {
        font-family: "CMU Serif";
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-serif-500-roman.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Serif";
        font-style: italic;
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-serif-500-italic.woff2") format("woff2");
      }

      @font-face {
        font-family: "CMU Typewriter Text";
        font-weight: 400;
        src: url("node_modules/computer-modern/fonts/cmu-typewriter-text-500-roman.woff2") format("woff2");
      }

      /* Frames are opaque, on the documentation site's page colors, so
         animated WebP frames blend without lossy alpha. Colors keep the
         site's meanings: notebook results are green, the scene is blue, and
         yellow surrounds what the movie reads. */
      :root {
        --page: #ffffff;
        --ink: #16191d;
        --muted: #69717a;
        --rule: #e6e8eb;
        --notebook: #4f7a3a;
        --scene: #1c758a;
        --ring: #b8860b;
        --wash: rgb(184 134 11 / 8%);
      }

      body[data-theme="dark"] {
        --page: #11161c;
        --ink: #ececec;
        --muted: #848b94;
        --rule: #222932;
        --notebook: #83c167;
        --scene: #58c4dd;
        --ring: #ffff00;
        --wash: rgb(255 255 0 / 6%);
      }

      html,
      body {
        margin: 0;
        background: var(--page);
      }

      #canvas {
        position: relative;
        display: grid;
        grid-template-columns: 440px 1fr;
        gap: 40px;
        box-sizing: border-box;
        width: 1200px;
        height: 720px;
        padding: 28px 36px 32px;
        background: var(--page);
        color: var(--ink);
        font-family: "CMU Serif", serif;
      }

      .caption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 17px;
        font-style: italic;
      }

      .caption code {
        font: 400 14px "CMU Typewriter Text", monospace;
        font-style: normal;
      }

      .notebook {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* The cell the movie reads gets Manim's SurroundingRectangle: square,
         yellow, and clear of marimo's own border. */
      .cell {
        position: relative;
      }

      .cell img {
        display: block;
        width: 100%;
      }

      .cell::after {
        position: absolute;
        inset: -8px;
        border: 2px solid var(--ring);
        content: "";
        opacity: var(--focus, 0);
        pointer-events: none;
      }

      .movie {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #11161c;
      }

      .movie img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .movie .next {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .render {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        padding: 16px;
        background: rgb(17 22 28 / 55%);
        opacity: 0;
      }

      .render span {
        padding: 5px 10px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 2px;
        background: rgb(17 22 28 / 88%);
        color: #ececec;
        font: 400 13px "CMU Typewriter Text", monospace;
      }

      .render i {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: #58c4dd;
        transform: scaleX(var(--progress, 0));
        transform-origin: left;
      }

      .player {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 14px;
        height: 40px;
        color: var(--muted);
        font: 400 13px "CMU Typewriter Text", monospace;
        font-variant-numeric: tabular-nums;
      }

      .player .track {
        height: 1px;
        background: var(--rule);
      }

      .player .track i {
        display: block;
        height: 1.5px;
        margin-top: -0.25px;
        background: var(--scene);
        transform: scaleX(var(--progress, 0));
        transform-origin: left;
      }

      .reads h2 {
        margin: 8px 0 6px;
        color: var(--muted);
        font-size: 17px;
        font-style: italic;
        font-weight: 400;
      }

      .read {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        padding: 0 12px;
      }

      .read::before {
        position: absolute;
        inset: 2px 0;
        border: 2px solid var(--ring);
        background: var(--wash);
        content: "";
        opacity: var(--focus, 0);
      }

      .read code {
        position: relative;
        font: 400 15px "CMU Typewriter Text", monospace;
      }

      .read code b {
        color: var(--notebook);
        font-weight: 400;
      }

      .read span {
        position: relative;
        color: var(--muted);
        font: 400 13px "CMU Typewriter Text", monospace;
      }

      .cursor {
        position: absolute;
        z-index: 2;
        width: 20px;
        height: 20px;
        margin: -2px 0 0 -4px;
        opacity: 0;
        transform-origin: 4px 2px;
        filter: drop-shadow(0 1px 1.5px rgb(0 0 0 / 35%));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <section>
        <p class="caption">Notebook <code>dataflow.py</code></p>
        <div class="notebook">
          <div class="cell" data-cell="controls"><img alt="" /></div>
          <div class="cell" data-cell="cascade"><img alt="" /></div>
          <div class="cell" data-cell="summary"><img alt="" /></div>
        </div>
      </section>
      <section>
        <p class="caption">Animation view <code>scene.py</code></p>
        <div class="movie">
          <img class="current" alt="" />
          <img class="next" alt="" />
          <div class="render"><span></span><i></i></div>
        </div>
        <div class="player">
          <span class="time"></span>
          <div class="track"><i></i></div>
          <span class="meta"></span>
        </div>
        <div class="reads">
          <h2>Reads from the notebook</h2>
          <div class="read" data-read="nodes"><code>value(<b>"nodes"</b>)</code><span>layout</span></div>
          <div class="read" data-read="edges"><code>value(<b>"edges"</b>)</code><span>graph</span></div>
          <div class="read" data-read="backward"><code>value(<b>"backward"</b>)</code><span>topology</span></div>
          <div class="read" data-read="rerun"><code>value(<b>"rerun"</b>)</code><span>cascade</span></div>
          <div class="read" data-read="changed"><code>value(<b>"changed.value"</b>)</code><span>controls</span></div>
        </div>
      </section>
      <svg class="cursor" viewBox="0 0 20 20" aria-hidden="true">
        <path
          d="M4 2.2v13.6l3.5-3.3 2.3 5.2 2.4-1-2.3-5.1h4.9z"
          fill="#111"
          stroke="#fff"
          stroke-width="1.4"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <script type="module">
      const { manifest, theme } = window.hero;
      document.body.dataset.theme = theme;
      const shots = manifest.cells[theme];
      const cell = (name) => document.querySelector(`[data-cell="${name}"]`);
      const movie = document.querySelector(".movie");
      const cursor = document.querySelector(".cursor");
      const canvas = document.getElementById("canvas");

      const load = (img, src) =>
        img.getAttribute("src") === src ? Promise.resolve() : ((img.src = src), img.decode());
      const frame = (state, index) => `shots/movie-${state}/${String(index + 1).padStart(4, "0")}.png`;

      await load(cell("cascade").querySelector("img"), `shots/${shots.cascade.file}`);

      // `show` paints one frame of the timeline render.ts computes.
      window.show = async (frameState) => {
        const { choice, cursor: pointer, focus, movie: shown, reads, render } = frameState;
        await Promise.all([
          load(cell("controls").querySelector("img"), `shots/${shots.controls[choice].file}`),
          load(cell("summary").querySelector("img"), `shots/${shots.summary[choice].file}`),
          load(movie.querySelector(".current"), frame(shown.state, shown.frame)),
          shown.next
            ? load(movie.querySelector(".next"), frame(shown.next.state, shown.next.frame))
            : Promise.resolve(),
        ]);
        movie.querySelector(".next").style.opacity = String(shown.next?.opacity ?? 0);
        for (const name of ["controls", "cascade", "summary"]) {
          cell(name).style.setProperty("--focus", String(focus[name] ?? 0));
        }
        for (const row of document.querySelectorAll("[data-read]")) {
          row.style.setProperty("--focus", String(reads[row.dataset.read] ?? 0));
        }

        // The player follows whichever movie shows more.
        const playing = (shown.next?.opacity ?? 0) > 0.5 ? shown.next : shown;
        const { movie: metadata } = manifest.states[playing.state];
        const progress = playing.frame / (manifest.states[playing.state].frames - 1);
        const clock = (seconds) => `0:${String(Math.floor(seconds)).padStart(2, "0")}`;
        const player = document.querySelector(".player");
        player.querySelector(".track").style.setProperty("--progress", String(progress));
        player.querySelector(".time").textContent =
          `${clock(playing.frame / manifest.fps)} / ${clock(Math.ceil(metadata.duration))}`;
        player.querySelector(".meta").textContent = `${metadata.width} × ${metadata.height} · ${metadata.fps} fps`;

        const overlay = movie.querySelector(".render");
        overlay.style.opacity = String(render.opacity);
        overlay.style.setProperty("--progress", String(render.progress));
        overlay.querySelector("span").textContent = render.label;

        // The pointer rests on the choice it clicks.
        const controls = cell("controls");
        const scale = controls.clientWidth / shots.controls[choice].width;
        const target = shots.choices[pointer.target];
        const box = controls.getBoundingClientRect();
        const origin = canvas.getBoundingClientRect();
        cursor.style.left = `${box.left - origin.left + target.x * scale + pointer.dx}px`;
        cursor.style.top = `${box.top - origin.top + target.y * scale + pointer.dy}px`;
        cursor.style.opacity = String(pointer.opacity);
        cursor.style.transform = `scale(${pointer.pressed ? 0.9 : 1})`;
      };

      await document.fonts.ready;
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
